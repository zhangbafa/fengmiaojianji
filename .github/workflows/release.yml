name: Build and Release Electron App

on:
  push:
    tags:
      - v*.*.*

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Build frontend
        run: cd frontend && npm run build

      - name: Build SQLite3
        run: npm run resqlite

      - name: Build for Windows
        run: npm run build-w

      - name: Upload Windows release
        uses: softprops/action-gh-release@v1
        with:
          draft: true
          files: out/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Build frontend
        run: cd frontend && npm run build

      - name: Build SQLite3
        run: npm run resqlite

      - name: Build for macOS
        run: npm run build-m

      - name: Upload macOS release
        uses: softprops/action-gh-release@v1
        with:
          draft: true
          files: out/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3-dev libatk-bridge2.0-dev libxkbcommon-dev libxss1 libgtk-3-dev

      - name: Install dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Build frontend
        run: cd frontend && npm run build

      - name: Build SQLite3
        run: npm run resqlite

      - name: Build for Linux
        run: npm run build-l

      - name: Upload Linux release
        uses: softprops/action-gh-release@v1
        with:
          draft: true
          files: |
            out/*.AppImage
            out/*.deb
            out/*.rpm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}