name: Build and Release (Electron-Egg)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # ✅ 允许创建 release、上传产物

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build base project (frontend + electron)
        run: npm run build

      - name: Package Electron app by platform
        shell: bash
        run: |
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            npm run build-w || exit 1
          elif [[ "${{ matrix.os }}" == "macos-latest" ]]; then
            npm run build-m || exit 1
          else
            npm run build-l || exit 1
          fi

      - name: Check output directories
        run: |
          echo "=== Checking out directory ==="
          ls -R out || true

      - name: Upload packaged app
        uses: actions/upload-artifact@v4
        with:
          name: fengmiaojianji-${{ matrix.os }}
          path: out/**
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      # 🏷️ 自动生成唯一 tag 名称
      - name: Generate tag name
        id: tag
        run: echo "TAG_NAME=v$(date +'%Y.%m.%d-%H%M%S')" >> $GITHUB_ENV

      # 🚀 创建 GitHub Release（自动使用 token）
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: "Release ${{ env.TAG_NAME }}"
          body: "Auto release from main branch."
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
