name: Build and Release (Electron-Egg)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build base project (frontend + electron)
        run: npm run build

      - name: Package Electron app by platform
        shell: bash
        run: |
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            npm run build-w || exit 1
          elif [[ "${{ matrix.os }}" == "macos-latest" ]]; then
            npm run build-m || exit 1
          else
            npm run build-l || exit 1
          fi

      - name: Check output directories
        run: |
          echo "=== Checking build output ==="
          ls -R public/electron || true
          ls -R release || true
          ls -R dist || true

      - name: Upload packaged app
        uses: actions/upload-artifact@v4
        with:
          name: fengmiaojianji-${{ matrix.os }}
          path: |
            release/**
            public/electron/build/**
            dist/**
          if-no-files-found: warn

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
