# 工作流名称
name: Build Electron App

# 触发工作流的事件
on:
  push:
    branches:
      - main # 当 main 分支有 push 时触发
    tags:
      - 'v*.*.*' # 当一个 'v' 开头的 tag 被推送时触发，例如 v1.0.0

jobs:
  build:
    # 定义构建矩阵，用于在不同的操作系统上运行
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    # 指定运行此作业的操作系统
    runs-on: ${{ matrix.os }}

    steps:
      # 第一步：检出您的代码库
      - name: Checkout repository
        uses: actions/checkout@v3

      # 第二步：设置 Node.js 环境
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20' # 您可以根据 package.json 中 engines 的要求修改此版本

      # 第三步：安装依赖
      # 使用 npm ci 可以更快、更可靠地安装依赖
      - name: Install dependencies
        run: npm ci

      # 第四步：根据不同的操作系统执行相应的构建命令
      # 这些命令来自于您 package.json 中的 "scripts"
      - name: Build application
        run: |
          if [ "${{ runner.os }}" == "macOS" ]; then
            npm run build-m
          elif [ "${{ runner.os }}" == "Windows" ]; then
            npm run build-w
          elif [ "${{ runner.os }}" == "Linux" ]; then
            npm run build-l
          fi
      
      # 第五步：上传构建产物
      # 构建完成后，将 dist 目录下的文件打包上传
      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: electron-app-${{ matrix.os }}
          path: dist/

  release:
    # 只有在创建了新的 tag 时才运行此作业
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build # 依赖于 build 作业成功完成
    runs-on: ubuntu-latest
    steps:
      # 第一步：下载所有构建作业的产物
      - name: Download all artifacts
        uses: actions/download-artifact@v3
        with:
          path: artifacts/

      # 第二步：创建 GitHub Release
      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v1
        with:
          # 从 tag 名称中提取版本号作为发布标题
          name: Release ${{ github.ref_name }}
          # 自动生成发布说明
          generate_release_notes: true
          # 附加所有在 artifacts/ 目录下的构建产物
          files: |
            artifacts/electron-app-windows-latest/*
            artifacts/electron-app-macos-latest/*
            artifacts/electron-app-linux-latest/*
        env:
          # 需要一个具有 repo 权限的 GITHUB_TOKEN
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}